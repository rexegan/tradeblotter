name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/trade-blotter-id-j5a5er
      - claude/github-page-8mle46
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/app.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.rest.repos.listDeployments({ owner, repo, environment: 'github-pages', per_page: 10 });
            for (const d of deployments.data) {
              const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
              const state = statuses.data[0]?.state;
              if (['in_progress', 'queued', 'pending'].includes(state)) {
                core.info(`Cancelling stuck Pages deployment ${d.sha} (${state})`);
                try {
                  await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id: d.sha });
                } catch (e) { core.warning(`Cancel failed for ${d.sha}: ${e.message}`); }
              }
            }
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

  reassert:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url }}
    steps:
      - name: Wait out any competing legacy deploy
        run: sleep 150
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/app.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-final
      - id: deployment2
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-final
          timeout: 1800000
